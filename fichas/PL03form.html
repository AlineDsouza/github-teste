<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <div> <hr>
        <form class="formularioContacto">
            <h3>Formulário de contacto do CESAE</h3>
            <div class="dados">                
                <label for="name">Nome: </label>
                <input type="text" id="name" required placeholder="Nome"> <br>
                <label for="Email: ">Email: </label>
                <input type="text" required placeholder="Email">
            </div>
            <div class="genero">
              <p>Género</p>
            <input type="radio" name="genero" value="Feminino">
            <label for="html">Feminino</label><br>
            <input type="radio" id="css" name="genero" value="Masculino">
            <label for="css">Masculino</label><br>
            </div> <br>
            <div class="dataAtual">
                <label for="date">Data atual: </label>
                <input type="date" name="" id="">
            </div>
            <div class="select"> <br>
                <label for="turma">Turma: </label>
                <select name="listaTurma" id="listaTurma">
                    <option value="webdev">Web Developer & Mobile</option>
                    <option value="outro">Outra</option>
                </select>
            </div>
            <div class="mensagem"><br>
                <label for="mensagem">Mensagem: </label>
                <textarea name="mensagem" id="">Mensagem</textarea>
            </div>
            <div class="botao">
                <br>
                <button type="reset">Limpar</button>
                <button type="submit">Enviar</button>
            </div>
            
        </form>
    </div><hr> 
    <footer>
        <h4>Associados</h4>
        <img src="https://www.iefp.pt/documents/10181/190733/PO2030_2.png/c36313f1-e4a3-4da7-a36e-74270901dc48?t=1711532332130" alt="associados" width="250px">
        <br> desenvolvido por <b>Aline Silva</b>.</footer>
</body>
</html>
